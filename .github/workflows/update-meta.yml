name: Update Post Metadata

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight (UTC)
  workflow_dispatch: # Enable running manually via GitHub Actions UI

jobs:
  update-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run script to update metadata
        run: node scripts/update_meta.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: git-check
        run: |
          git status
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/posts.json
          git commit -m "Auto-update post metadata (words, reading time, dates)"
          git push
