<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Post | SonVH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/post.css" />
  <!-- Highlight.js theme -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
</head>

<body>
  <header class="nav">
    <div class="shell nav-inner">
      <div class="nav-actions">
        <a class="btn" href="/">Main page</a>
        <a class="btn btn-primary" id="post-source" href="#" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="shell panel">
        <div class="tag" id="post-tag">Post</div>
        <h1 class="title" id="post-title">Loading post...</h1>
        <p class="description" id="post-description">Preparing content...</p>
        <div class="status is-hidden" id="post-status" aria-live="polite"></div>
      </div>
    </section>
    <section class="content-wrap">
      <div class="shell post-layout">
        <article class="content" id="post-content">
          <p>Dang tai noi dung...</p>
        </article>
        <aside class="toc-shell" aria-labelledby="toc-title">
          <div class="toc-card">
            <div class="toc-eyebrow">Overview</div>
            <h2 class="toc-title" id="toc-title"></h2>
            <!-- <p class="toc-description" id="toc-description">Dang phan tich cac dau muc trong bai...</p> -->
            <nav class="toc-nav" id="post-toc" aria-label="Table of contents">
              <p class="toc-empty">Muc luc se hien khi bai viet co heading.</p>

            </nav>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <footer class="footer shell">
    <p>&copy; 2026 SonVH</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="../assets/post-page.js"></script>
</body>

</html>
